name: Manage shared RSS subscriptions

on:
  issues:
    types: [opened]

concurrency:
  group: technews-pages
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[구독] ') || startsWith(github.event.issue.title, '[구독 해제] '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
      result: ${{ steps.apply.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify issue and update source list
        id: apply
        run: python scripts/manage_subscription.py
      - name: Refresh feed index
        if: steps.apply.outputs.changed == 'true'
        run: python scripts/fetch_feeds.py
      - name: Save subscription and articles
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json site/data/articles.json
          git commit -m "Update shared RSS subscriptions"
          git push
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.apply.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.apply.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: manage
    if: needs.manage.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  close-issue:
    needs: [manage, deploy]
    if: >-
      always() && needs.manage.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report result and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.manage.outputs.result }}
        run: |
          case "$RESULT" in
            subscribed) message="공통 구독 목록에 추가하고 글 목록을 배포했습니다." ;;
            unsubscribed) message="공통 구독 목록에서 제거하고 글 목록을 배포했습니다." ;;
            already-subscribed) message="이미 공통 구독 목록에 있습니다." ;;
            already-unsubscribed) message="이미 공통 구독 목록에서 제거되었습니다." ;;
            *) exit 1 ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$message"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
