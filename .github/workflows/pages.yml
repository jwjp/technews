name: Refresh feeds and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

concurrency:
  group: technews-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh feed index
        run: python scripts/fetch_feeds.py
      - name: Save new articles
        run: |
          if ! git diff --quiet -- site/data/articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/articles.json
            git commit -m "Update feed index"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
